name: Update profile visuals
on:
  schedule:
    - cron: "17 0 * * *" # 07:17 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test
      - run: node scripts/generate.mjs
        env:
          PROFILE_PAT: ${{ secrets.PROFILE_PAT }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "chore: update profile visuals"
          git push
